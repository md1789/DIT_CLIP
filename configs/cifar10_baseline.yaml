training:
  epochs: 2
  batch_size: 64
  learning_rate: 3.0e-4
  dataset: cifar10_text
  data_root: ./data
  image_size: 32
  patch_size: 4
  hidden_size: 384
  depth: 8
  num_heads: 6
  mlp_ratio: 4.0
  use_clip_conditioning: true
  clip_model_name: ViT-B-32
  clip_pretrained: laion2b_s34b_b79k
  clip_embed_dim: 512
  num_workers: 4
  save_dir: ./experiments/cifar10_baseline/checkpoints
  log_every: 100
  save_every: 1
  seed: 42

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule: linear
